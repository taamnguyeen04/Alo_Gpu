[package]
name = "alogpu"
version = "0.1.0"
description = "AloGPU - Desktop control center for Modal & Kaggle"
authors = ["AloGPU"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
dirs = "5"
uuid = { version = "1.20.0", features = ["v4"] }
base64 = "0.23.1"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
